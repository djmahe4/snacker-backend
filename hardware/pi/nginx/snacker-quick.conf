# =============================================================================
#  SNACKER PLAN B: CLOUDFLARE QUICK TUNNEL REVERSE PROXY CONFIGURATION (NGINX)
# =============================================================================
#  Site Name: snacker-quick
#  Target: Raspberry Pi behind Cloudflare Quick Tunnel (*.trycloudflare.com)
#  Frontend: Hosted remotely on Vercel
#  Internal Ports:
#    - Port 7000: YouPI-PG Checkout Portal & youpi.js SDK
#    - Port 6100: YouPI-PG Payment Core REST API & SSE Streams
#    - Port 6001: YouPI-PG Merchant Admin Dashboard
#    - Port 5000: Snacker Standalone Express Backend & Payment Webhook
# =============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 25M;

    # -------------------------------------------------------------------------
    # 1. YouPI-PG SDK Client Script (served to Vercel PWA)
    # -------------------------------------------------------------------------
    location = /youpi.js {
        proxy_pass http://127.0.0.1:7000/youpi.js;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # -------------------------------------------------------------------------
    # 2. YouPI-PG Customer Checkout Screens & Live SSE Payment Stream
    # -------------------------------------------------------------------------
    location /checkout/ {
        proxy_pass http://127.0.0.1:7000/checkout/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Disable buffering so SSE live updates reach student's phone instantly
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # -------------------------------------------------------------------------
    # 3. YouPI-PG Payment Core REST API
    # -------------------------------------------------------------------------
    location /api/v1/ {
        proxy_pass http://127.0.0.1:6100/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # -------------------------------------------------------------------------
    # 4. Merchant Admin Dashboard (Optional Kiosk Access)
    # -------------------------------------------------------------------------
    location /youpi-admin/ {
        proxy_pass http://127.0.0.1:6001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # -------------------------------------------------------------------------
    # 5. Snacker Payment Webhook Handler (Express Backend on Port 5000)
    # -------------------------------------------------------------------------
    # Buffering is disabled to preserve raw body byte-for-byte for HMAC signature verification
    location /api/youpi-webhook {
        proxy_pass http://127.0.0.1:5000/api/youpi-webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;
        proxy_request_buffering off;
    }

    # -------------------------------------------------------------------------
    # 6. Default Fallback -> YouPI-PG Checkout Portal (Port 7000)
    # -------------------------------------------------------------------------
    # Frontend PWA runs on Vercel, so root on the Pi directs to the local gateway
    location / {
        proxy_pass http://127.0.0.1:7000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
