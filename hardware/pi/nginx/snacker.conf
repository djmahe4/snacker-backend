# =============================================================================
#  SNACKER + YOUPI-PG UNIFIED REVERSE PROXY CONFIGURATION (NGINX)
# =============================================================================

# Map WebSocket Upgrade header
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Maximum request body size for uploads / webhooks
    client_max_body_size 25M;

    # -------------------------------------------------------------------------
    # 1. Next.js Client Web App & API Handlers (Port 3000)
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Preserve client headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / HMR support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # -------------------------------------------------------------------------
    # 2. YouPI-PG Gateway - Customer Checkout Portal & youpi.js SDK (Port 7000)
    # -------------------------------------------------------------------------
    # Serves youpi.js directly to the frontend app
    location = /youpi.js {
        proxy_pass http://127.0.0.1:7000/youpi.js;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Customer dynamic UPI QR checkout modal & pages
    location /checkout/ {
        proxy_pass http://127.0.0.1:7000/checkout/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Disable buffering for live Server-Sent Events (SSE) payment stream
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # -------------------------------------------------------------------------
    # 3. YouPI-PG Payment Core REST API & SSE Queue Streams (Port 6100)
    # -------------------------------------------------------------------------
    location /api/v1/ {
        proxy_pass http://127.0.0.1:6100/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE & WebSocket support for real-time payment status promotion
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # -------------------------------------------------------------------------
    # 4. YouPI-PG Merchant Admin Dashboard (Port 6001)
    # -------------------------------------------------------------------------
    location /youpi-admin/ {
        proxy_pass http://127.0.0.1:6001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # -------------------------------------------------------------------------
    # 5. Snacker Payment Webhook Handler (Port 3000 / 5000)
    # -------------------------------------------------------------------------
    # Buffering is disabled to preserve raw body byte-for-byte for HMAC signature verification
    location /api/youpi-webhook {
        proxy_pass http://127.0.0.1:3000/api/youpi-webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
        proxy_request_buffering off;
    }
}
